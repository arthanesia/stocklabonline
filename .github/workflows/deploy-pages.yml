name: Deploy StockLab Online

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "assets/**"
      - "stocklab-assets-upload.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract original card artwork into the repository
        shell: bash
        run: |
          set -euo pipefail
          test -f stocklab-assets-upload.zip
          unzip -oq stocklab-assets-upload.zip -d .
          image_count="$(find assets/cards -type f -name '*.webp' | wc -l | tr -d ' ')"
          echo "Extracted card images into repository: ${image_count}"
          test "${image_count}" = "56"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if ! git diff --cached --quiet; then
            git commit -m "Publish extracted StockLab card assets"
            git push origin HEAD:main
          else
            echo "Card artwork is already present in the repository."
          fi

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -R assets _site/assets

          image_count="$(find _site/assets/cards -type f -name '*.webp' | wc -l | tr -d ' ')"
          echo "Extracted card images: ${image_count}"
          test "${image_count}" = "56"
          test -f _site/assets/cards/action/tambang-rumor.webp
          test -f _site/assets/cards/action/keuangan-info-bursa.webp
          test -f _site/assets/cards/economy/buyback.webp
          test -f _site/assets/cards/boards/papan-reksa-dana.webp

          du -sh _site
          find _site/assets/cards -type f -name '*.webp' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
